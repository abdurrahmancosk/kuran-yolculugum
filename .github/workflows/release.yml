name: Derle ve Yayınla

# main dalına her gönderimde: APK derlenir, imzalanır ve yeni bir sürüm (Release) yayınlanır.
# Telefondaki uygulama her gün releases/latest/download/update.json dosyasını denetler ve kendini günceller.
# Aynı versionCode ikinci kez yayınlanmaz; yeni sürüm için app/build.gradle.kts içinde versionCode artırılmalıdır.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sürüm bilgisi
        id: ver
        run: |
          CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v$NAME" >> "$GITHUB_OUTPUT"
          echo "Sürüm: $NAME ($CODE)"

      - name: Bu sürüm daha önce yayınlandı mı? İmza anahtarı tanımlı mı?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::KEYSTORE_BASE64 gizli değişkeni tanımlı değil; otomatik yayın atlandı (README'deki kurulum adımlarına bakın)."
          elif gh release view "${{ steps.ver.outputs.tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ steps.ver.outputs.tag }} zaten yayında; yeni sürüm için versionCode/versionName artırın."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.check.outputs.skip == 'false'
        with:
          distribution: temurin
          java-version: '17'

      - name: İmza anahtarını hazırla
        if: steps.check.outputs.skip == 'false'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/kuranyolculugu.jks

      - name: APK derle
        if: steps.check.outputs.skip == 'false'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk KuranYolculugum.apk
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs KuranYolculugum.apk | head -3

      - name: Sürümü yayınla
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.ver.outputs.code }}
          NAME: ${{ steps.ver.outputs.name }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          export SHA=$(sha256sum KuranYolculugum.apk | cut -d' ' -f1)
          python3 tools/make_update_json.py
          cat update.json
          gh release create "$TAG" KuranYolculugum.apk update.json \
            --repo "$GITHUB_REPOSITORY" --title "Kur'an Yolculuğum $NAME" --notes-file RELEASE_NOTES.txt --latest
