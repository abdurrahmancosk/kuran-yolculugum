name: Derle ve Yayınla

# main dalına her gönderimde APK derlenir, imzalanır ve "guncelleme" dalına (APK + update.json) yayınlanır.
# Telefondaki uygulama her gün bu dalı denetler ve yeni sürümü kendiliğinden kurar.
# Yeni sürüm için app/build.gradle.kts içinde versionCode/versionName artırılmalıdır; aynı sürüm ikinci kez yayınlanmaz.
# Gerekli gizli değişkenler (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: İmza anahtarı tanımlı mı?
        id: key
        env:
          HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "ok=$HAS_KEY" >> "$GITHUB_OUTPUT"
          if [ "$HAS_KEY" != "true" ]; then echo "::warning::KEYSTORE_BASE64 tanımlı değil; otomatik yayın atlandı (README'ye bakın)."; fi

      - uses: actions/setup-java@v4
        if: steps.key.outputs.ok == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - name: Derle ve yayınla
        if: steps.key.outputs.ok == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/kuranyolculugu.jks
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          chmod +x gradlew tools/publish.sh
          ./tools/publish.sh
